name: Tests

on:
  workflow_dispatch:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate shell scripts
        run: |
          bash -n src/*.sh
          bash -n scripts/*.sh
          bash -n tests/*.sh

      - name: Run shell tests
        run: |
          bash tests/test_restore_snapshot.sh
          bash tests/test_bootstrap_workspace.sh
          bash tests/test_bootstrap_ltx25.sh

      - name: Validate JSON files
        run: |
          python3 -m json.tool .runpod/hub.json >/dev/null
          python3 -m json.tool .runpod/tests.json >/dev/null
          python3 -m json.tool package.json >/dev/null
          python3 -m json.tool test_input.json >/dev/null
          python3 -m json.tool video_ltx2_5_i2v_API.json >/dev/null

      - name: Validate GitHub Actions workflow syntax
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].sort.each { |p| YAML.load_file(p); puts "OK #{p}" }'

      - name: Validate Python syntax
        run: |
          python3 -m compileall -q \
            handler.py \
            frontend_app.py \
            ltx_payload_builder.py \
            workflow_support.py \
            src

      - name: Run workflow and payload tests
        run: |
          python3 -m unittest \
            tests.test_ltx_payload_builder \
            tests.test_ltx25_workflow \
            tests.test_verify_comfy_models \
            tests.test_workflow_support \
            -v

      - name: Validate Docker bake targets
        run: |
          docker buildx bake --print base | tee /tmp/base-bake.json >/dev/null
          docker buildx bake --print ltx2-5-distilled-int8 | tee /tmp/cu130-bake.json >/dev/null
          docker buildx bake --print ltx2-5-distilled-int8-cu128 | tee /tmp/cu128-bake.json >/dev/null
          grep -q 'ubuntu:24.04' /tmp/base-bake.json
          grep -q 'download.pytorch.org/whl/cu130' /tmp/cu130-bake.json
          grep -q 'download.pytorch.org/whl/cu128' /tmp/cu128-bake.json
